name: Kanal tarama (tek seferlik)

# tvplus, Digiturk, D-Smart ve Tivibu kanal listelerinde istenen kanalları arar.
# EPG'ye ve siteye dokunmaz; sonucu "deneme-sonuc" dalına yazar. Tarama bitince silinecek.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_KV_ID: ${{ secrets.CF_KV_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Tara
        run: |
          cat > t.py <<'EOF'
          import json, re, gzip, html, os, urllib.request, urllib.error, http.cookiejar
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          ARA = ['premiere 2', 'action', 'box office', 'boxoffice', 'aile', 'aksiyon', 'komedi', 's toon', 'stoon', 's-toon',
                 'cocuk smart', 'çocuk smart', 'azoomee', 'azomee', 'kral', 'nr1', 'nr 1', 'number1', 'number 1', 'dance', 'rap',
                 'bein sports 1', 'beinsports1', 'bein sport 1']
          out = []
          def yaz(*a):
              s = ' '.join(str(x) for x in a); print(s); out.append(s)
          def uygun(ad):
              a = (ad or '').lower().replace('i̇', 'i')
              return any(k in a for k in ARA)

          # ---- tvplus kanal listesi
          B = 'https://izmaottvsc14.tvplus.com.tr:33207/EPG/JSON/'
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def post(yol, govde):
              try:
                  r = op.open(urllib.request.Request(B + yol, json.dumps(govde).encode(),
                      {'content-type': 'application/json', 'user-agent': 'Mozilla/5.0'}), timeout=60)
                  return r.read().decode('utf-8', 'replace')
              except Exception as e:
                  return 'HATA ' + str(e)[:150]
          post('Authenticate', {'terminaltype': 'webtv', 'terminalvendor': 'Mozilla/5.0', 'osversion': 'Win32',
                                'userType': '3', 'utcEnable': '1', 'timezone': 'Europe/Istanbul'})
          tv = {}
          denemeler = [
              ('AllChannel', {'properties': [{'name': 'logicalChannel', 'include': '/channellist/logicalChannel/contentId,/channellist/logicalChannel/name'}],
                              'metaDataVer': 'Channel/1.1', 'channelNamespace': '2', 'filterlist': [{'key': 'IsHide', 'value': '-1'}], 'returnSatChannel': 0}),
              ('AllChannel', {}),
              ('ChannelList', {'type': 'VIDEO_CHANNEL', 'count': '2000', 'offset': '0'}),
              ('ChannelList', {'count': '2000', 'offset': '0'}),
          ]
          def topla(o):
              if isinstance(o, dict):
                  ad = o.get('name') or o.get('channelName')
                  cid = o.get('id') or o.get('contentId') or o.get('channelid')
                  if ad and cid:
                      tv[str(cid)] = ad
                  for v in o.values(): topla(v)
              elif isinstance(o, list):
                  for v in o: topla(v)
          for yol, govde in denemeler:
              r = post(yol, govde)
              try:
                  once = len(tv); topla(json.loads(r))
                  yaz(f'## tvplus {yol} {json.dumps(govde)[:80]} -> {len(tv) - once} yeni kanal')
              except Exception:
                  yaz(f'## tvplus {yol} -> okunamadi: {r[:200]}')
          yaz(f'## tvplus toplam kanal: {len(tv)}')
          for cid, ad in sorted(tv.items(), key=lambda x: x[1]):
              if uygun(ad): yaz(f'tvplus  id={cid}  ad={ad}')

          # ---- KV'deki kutu sayfaları (Digiturk, D-Smart, Tivibu)
          def kv(anahtar):
              url = ('https://api.cloudflare.com/client/v4/accounts/{}/storage/kv/namespaces/{}/values/{}'
                     .format(os.environ['CLOUDFLARE_ACCOUNT_ID'], os.environ['CF_KV_ID'], anahtar))
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      v = r.read()
                  return gzip.decompress(v) if v[:2] == b'\x1f\x8b' else v
              except urllib.error.HTTPError:
                  return None
          bugun = datetime.now(ZoneInfo('Europe/Istanbul')).date()
          def son_kayit(onek):
              for g in range(0, 4):
                  v = kv(f'{onek}-{bugun - timedelta(days=g):%Y-%m-%d}')
                  if v: return v
              return None

          d = son_kayit('digiturk')
          if d:
              m = d.decode('utf-8', 'replace'); dg = {}
              for blok in m.split('channelContent')[1:]:
                  ad = re.search(r'id="channelID"[^>]*value="([^"]*)"', blok[:1500])
                  sid = re.search(r"getDetail\('[^']*',\s*(\d+)\)", blok)
                  if ad and sid: dg.setdefault(sid.group(1), html.unescape(ad.group(1)).strip())
              yaz(f'## digiturk kanal sayisi: {len(dg)}')
              for sid, ad in sorted(dg.items(), key=lambda x: x[1]):
                  if uygun(ad): yaz(f'digiturk  site_id={sid}  ad={ad}')
          else:
              yaz('## digiturk kaydi yok')

          s = son_kayit('dsmart')
          if s:
              ds = {}
              def dtopla(o):
                  if isinstance(o, dict):
                      ad = o.get('channel_name') or o.get('name') or o.get('title')
                      cid = o.get('_id') or o.get('channel_id') or o.get('id')
                      if ad and cid and isinstance(ad, str): ds.setdefault(str(cid), ad)
                      for v in o.values(): dtopla(v)
                  elif isinstance(o, list):
                      for v in o: dtopla(v)
              for satir in s.decode('utf-8', 'replace').splitlines():
                  try: dtopla(json.loads(satir))
                  except Exception: pass
              yaz(f'## dsmart ad/id sayisi: {len(ds)}')
              for cid, ad in sorted(ds.items(), key=lambda x: x[1]):
                  if uygun(ad): yaz(f'dsmart  site_id={cid}  ad={ad}')
          else:
              yaz('## dsmart kaydi yok')

          t = son_kayit('tivibu')
          if t:
              kodlar = [l.split('\t', 1)[0] for l in t.decode('utf-8', 'replace').splitlines() if '\t' in l]
              yaz(f'## tivibu kayittaki kanal kodu sayisi: {len(kodlar)} (kutunun cektigi kanallar)')
              for k in kodlar:
                  if uygun(k): yaz(f'tivibu  kod={k}')
          open('sonuc.md', 'w').write('\n'.join(out) + '\n')
          EOF
          python3 t.py

      - name: Sonucu deneme-sonuc dalina yaz
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          cp sonuc.md /tmp/sonuc.md
          git checkout --orphan deneme-sonuc
          git rm -rq --cached . ; rm -rf ./* .github; cp /tmp/sonuc.md .
          git add sonuc.md && git commit -qm "kanal tarama sonucu" && git push -fq origin deneme-sonuc
