name: Sifre testi (tek seferlik)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      ADRES: https://epg-sifre-testi.epgdeposu.workers.dev
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deneme sunucusunu kur
        run: |
          mkdir -p t/src && cd t
          cat > wrangler.toml <<'T'
          name = "epg-sifre-testi"
          main = "src/index.js"
          compatibility_date = "2026-09-01"
          workers_dev = true
          T
          cat > src/index.js <<'T'
          export default {
            async fetch(req) {
              const n = Number(new URL(req.url).searchParams.get("n")) || 1;
              const anahtar = await crypto.subtle.importKey("raw", new TextEncoder().encode("ornek-sifre-123"), "PBKDF2", false, ["deriveBits"]);
              const tuz = crypto.getRandomValues(new Uint8Array(16));
              await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: tuz, iterations: n }, anahtar, 256);
              return new Response("ok " + n);
            },
          };
          T
          npx --yes wrangler@4 deploy
          for i in $(seq 1 30); do curl -fs "$ADRES/?n=1" && break; sleep 10; done

      - name: Olcum
        run: |
          for n in 10000 25000 50000 100000; do
            ok=0; hata=0
            for i in $(seq 1 20); do
              if curl -fs --max-time 30 "$ADRES/?n=$n" > /dev/null; then ok=$((ok+1)); else hata=$((hata+1)); fi
            done
            echo "::notice title=PBKDF2 $n tekrar::basarili=$ok hatali=$hata"
          done

      - name: Deneme sunucusunu sil
        if: always()
        run: cd t && npx --yes wrangler@4 delete --name epg-sifre-testi --force || true
