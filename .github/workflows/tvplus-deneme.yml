name: tvplus deneme (tek seferlik)

# tvplus'ta uzun program açıklaması (yönetmen, oyuncular, özet) alınabiliyor mu diye bakar.
# EPG'ye ve siteye dokunmaz; sonucu "deneme-sonuc" dalına yazar. Deneme bitince silinecek.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deneme:
    runs-on: ubuntu-latest
    steps:
      - name: tvplus'u dene
        run: |
          cat > d.py <<'EOF'
          import json, urllib.request, http.cookiejar, datetime
          B = "https://izmaottvsc14.tvplus.com.tr:33207/EPG/JSON/"
          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          out = []
          def yaz(*a):
              s = " ".join(str(x) for x in a); print(s); out.append(s)
          def post(yol, govde):
              try:
                  r = op.open(urllib.request.Request(B + yol, json.dumps(govde).encode(),
                      {"content-type": "application/json", "user-agent": "Mozilla/5.0"}), timeout=30)
                  return r.read().decode("utf-8", "replace")
              except Exception as e:
                  return "HATA " + str(e)[:200]
          a = post("Authenticate", {"terminaltype": "webtv", "terminalvendor": "Mozilla/5.0", "osversion": "Win32",
                                    "userType": "3", "utcEnable": "1", "timezone": "Europe/Istanbul"})
          yaz("## Authenticate:", a[:300])
          simdi = datetime.datetime.utcnow() + datetime.timedelta(hours=3)
          bas = simdi.replace(hour=0, minute=0, second=0).strftime("%Y%m%d%H%M%S")
          son = (simdi.replace(hour=0, minute=0, second=0) + datetime.timedelta(days=1)).strftime("%Y%m%d%H%M%S")
          liste = post("PlayBillList", {"type": "2", "channelid": "130", "begintime": bas, "endtime": son, "isFillProgram": 1})
          try:
              pl = json.loads(liste).get("playbilllist", [])
          except Exception:
              pl = []; yaz("## PlayBillList okunamadi:", liste[:300])
          yaz("## PlayBillList program sayisi:", len(pl))
          if pl:
              yaz("## Ilk programin tum alanlari:")
              yaz(json.dumps(pl[0], ensure_ascii=False, indent=1)[:4000])
              uzun = max(pl, key=lambda p: len(p.get("introduce") or ""))
              yaz("## En uzun introduce:", len(uzun.get("introduce") or ""), (uzun.get("introduce") or "")[:300])
          # properties ile ek alan istemeyi dene
          for prop in ([{"name": "playbill", "include": "ALL"}], [{"name": "playbill", "include": "cast,introduce,seriesID,genres,country"}]):
              r = post("PlayBillList", {"type": "2", "channelid": "130", "begintime": bas, "endtime": son, "isFillProgram": 1, "properties": prop})
              try:
                  p0 = json.loads(r).get("playbilllist", [{}])[0]
                  yaz("## properties", json.dumps(prop), "-> alanlar:", sorted(p0.keys()))
              except Exception:
                  yaz("## properties", json.dumps(prop), "->", r[:200])
          # ayrıntı adreslerini dene (dizi/film olan ilk program)
          hedef = next((p for p in pl if p.get("genres") and "Haber" not in str(p.get("genres"))), pl[0] if pl else {})
          pid = str(hedef.get("id", ""))
          yaz("## Ayrinti denemesi, program:", hedef.get("name"), "id:", pid)
          adaylar = [
              ("PlayBillDetail", {"playbillid": pid}),
              ("GetPlayBillDetail", {"playbillid": pid}),
              ("QueryPlaybillDetail", {"playbillId": pid}),
              ("ContentDetail", {"playbill": pid}),
              ("ContentDetail", {"playbill": pid, "idType": 0}),
              ("PlayBillContextEx", {"playbillid": pid, "type": "0"}),
          ]
          for k in ("seriesID", "programid", "foreignsn", "contentid", "vodid"):
              if hedef.get(k):
                  adaylar.append(("ContentDetail", {"vod": str(hedef[k])}))
          for yol, govde in adaylar:
              r = post(yol, govde)
              yaz("###", yol, json.dumps(govde), "->", len(r), "karakter")
              yaz(r[:2500])
          open("sonuc.md", "w").write("\n".join(out) + "\n")
          EOF
          python3 d.py

      - name: Sonucu deneme-sonuc dalina yaz
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan deneme-sonuc
          git rm -rq --cached . ; mv sonuc.md /tmp/; rm -rf ./* .github; mv /tmp/sonuc.md .
          git add sonuc.md && git commit -qm "tvplus deneme sonucu" && git push -fq origin deneme-sonuc
