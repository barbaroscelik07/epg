name: Faz1 - Test dosyasi ve Worker

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_KV_ID: ${{ secrets.CF_KV_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 5 MB test XML olustur
        run: |
          python3 - <<'EOF'
          from datetime import datetime, timedelta
          now = datetime.now().replace(minute=0, second=0, microsecond=0)
          parts = ['<?xml version="1.0" encoding="UTF-8"?>\n<tv generator-info-name="epg-test">\n']
          for c in range(1, 151):
              parts.append(f'  <channel id="test{c}.tr"><display-name>Test Kanal {c}</display-name></channel>\n')
          for c in range(1, 151):
              t = now
              for p in range(144):
                  e = t + timedelta(minutes=30)
                  parts.append(f'  <programme start="{t:%Y%m%d%H%M%S} +0300" stop="{e:%Y%m%d%H%M%S} +0300" channel="test{c}.tr"><title lang="tr">Örnek Program {p}</title><desc lang="tr">Bu bir test açıklamasıdır; dosya boyutunu ölçmek için üretildi.</desc></programme>\n')
                  t = e
          parts.append('</tv>\n')
          open("guide.xml", "w", encoding="utf-8").write("".join(parts))
          EOF
          ls -lh guide.xml

      - name: KV kimligini wrangler.toml'a yaz
        run: sed -i "s/KV_ID_BURAYA/${CF_KV_ID}/" wrangler.toml

      - name: Test dosyasini KV'ye yukle
        run: npx --yes wrangler@4 kv key put "guide.xml" --path=guide.xml --namespace-id="${CF_KV_ID}" --remote

      - name: Worker'i yayinla
        run: npx --yes wrangler@4 deploy
