name: EPG guncelle

on:
  workflow_dispatch:
  schedule:
    # Gunde 2 kez: 05:00 ve 17:00 (Istanbul saati)
    - cron: "0 2,14 * * *"

concurrency:
  group: epg-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_KV_ID: ${{ secrets.CF_KV_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: iptv-org/epg aracini indir
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg-tool
          cd epg-tool && npm ci --no-audit --no-fund

      - name: Turksat eksik ara sertifikasini tamamla
        run: |
          set +e
          HOST=www.turksatkablo.com.tr
          for deneme in 1 2 3; do
            echo | timeout 30 openssl s_client -connect $HOST:443 -servername $HOST 2>/dev/null | openssl x509 > leaf.pem 2>/dev/null
            [ -s leaf.pem ] && break
            echo "Turksat'a baglanilamadi ($deneme. deneme), 30 sn sonra tekrar"; sleep 30
          done
          URL=$(openssl x509 -in leaf.pem -noout -text 2>/dev/null | grep -oP 'CA Issuers - URI:\K\S+' | head -1)
          echo "Ara sertifika adresi: ${URL:-bulunamadi}"
          if [ -n "$URL" ] && curl -fsSL --max-time 30 "$URL" -o inter.raw; then
            openssl x509 -inform DER -in inter.raw -out inter.pem 2>/dev/null \
              || openssl x509 -in inter.raw -out inter.pem 2>/dev/null \
              || openssl pkcs7 -inform DER -in inter.raw -print_certs -out inter.pem 2>/dev/null
            if openssl x509 -in inter.pem -noout -subject 2>/dev/null; then
              echo "NODE_EXTRA_CA_CERTS=$PWD/inter.pem" >> "$GITHUB_ENV"
              echo "Ara sertifika eklendi."
            fi
          fi
          exit 0

      - name: Kanal listesini kaynaklara ayir
        run: |
          python3 - <<'EOF'
          import re
          satirlar = open('channels.xml', encoding='utf-8').read().splitlines()
          kanal = [s for s in satirlar if '<channel ' in s]
          def yaz(ad, secim):
              with open(ad, 'w', encoding='utf-8') as f:
                  f.write('<?xml version="1.0" encoding="UTF-8"?>\n<channels>\n' + '\n'.join(secim) + '\n</channels>\n')
          tv = [s for s in kanal if 'site="tvplus.com.tr"' in s]
          ozel = ('site="tvplus.com.tr"', 'site="turksatkablo.com.tr"', 'site="digiturk.com.tr"', 'site="dsmart.com.tr"', 'site="tivibu.com.tr"', 'site="logo"')
          diger = [s for s in kanal if not any(o in s for o in ozel)]
          yaz('tvplus-channels.xml', tv); yaz('diger-channels.xml', diger)
          print('tvplus:', len(tv), 'diger:', len(diger))
          EOF

      - name: EPG verisini topla - tvplus (kendi okuyucu; olmazsa iptv-org araci)
        run: |
          mkdir -p guides
          if python3 tvplus_oku.py; then
            echo "::notice::tvplus kendi okuyucuyla alindi"
            exit 0
          fi
          echo "::warning::tvplus kendi okuyucuyla alinamadi, iptv-org aracina donuluyor"
          rm -f guides/tvplus.com.tr.xml
          cd epg-tool
          npm run grab --- \
            --channels=../tvplus-channels.xml \
            --output="../guides/{site}.xml" \
            --days=3 \
            --maxConnections=1 \
            --delay=1500 \
            --timeout=60000 2>&1 | tee ../grab.log || true

      - name: EPG verisini topla - diger kaynaklar
        working-directory: epg-tool
        run: |
          npm run grab --- \
            --channels=../diger-channels.xml \
            --output="../guides/{site}.xml" \
            --days=3 \
            --maxConnections=3 \
            --timeout=60000 2>&1 | tee -a ../grab.log || true

      - name: Turksat verisini topla (ad ile eslestirme)
        run: python3 turksat.py || true

      - name: Digiturk verisini oku (Android box'tan)
        run: python3 digiturk.py || true

      - name: D-Smart verisini oku (Android box'tan)
        run: python3 dsmart.py || true

      - name: Tivibu verisini oku (Android box'tan)
        run: python3 tivibu.py || true

      - name: Kaynaklari birlestir ve rapor yaz
        run: python3 birlestir.py

      - name: KV'ye yukle
        run: |
          npx --yes wrangler@4 kv key put "guide.xml" --path=guide.xml --namespace-id="${CF_KV_ID}" --remote
          npx --yes wrangler@4 kv key put "guide.xml.gz" --path=guide.xml.gz --namespace-id="${CF_KV_ID}" --remote

      - name: Worker'i yayinla
        env:
          YONETIM_SIFRESI: ${{ secrets.YONETIM_SIFRESI }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BANKA_ALICI: ${{ secrets.BANKA_ALICI }}
          BANKA_IBAN: ${{ secrets.BANKA_IBAN }}
        run: |
          mkdir -p public/logo
          cp logos/*.png public/logo/ 2>/dev/null || true
          sed -i "s/KV_ID_BURAYA/${CF_KV_ID}/" wrangler.toml
          for deneme in 1 2 3; do   # Cloudflare geçici hata (502 vb.) verirse tekrar dene
            npx --yes wrangler@4 deploy && break
            [ "$deneme" = 3 ] && exit 1
            echo "Yayin basarisiz ($deneme. deneme), 60 sn sonra tekrar"; sleep 60
          done
          for ad in YONETIM_SIFRESI TELEGRAM_TOKEN TELEGRAM_CHAT_ID BANKA_ALICI BANKA_IBAN; do
            deger=$(printenv "$ad" || true)
            if [ -n "$deger" ]; then
              printf '%s' "$deger" | npx --yes wrangler@4 secret put "$ad"
            else
              echo "$ad secret'i yok, atlandi"
            fi
          done
          # Telegram destek hattı: botun mesajları sunucuya iletmesini ayarla, bot adını kaydet
          if [ -n "$TELEGRAM_TOKEN" ]; then
            GIZLI=$(printf '%s' "$TELEGRAM_TOKEN" | sha256sum | cut -c1-32)
            curl -fsS "https://api.telegram.org/bot${TELEGRAM_TOKEN}/setWebhook" \
              --data-urlencode "url=https://epg.epgdeposu.workers.dev/telegram" \
              --data-urlencode "secret_token=${GIZLI}" \
              --data-urlencode 'allowed_updates=["message"]' -o /dev/null && echo "Telegram webhook ayarlandi" || echo "Telegram webhook ayarlanamadi"
            BOT=$(curl -fsS "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getMe" | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['username'])" || true)
            if [ -n "$BOT" ]; then
              npx --yes wrangler@4 kv key put "telegram-bot" "$BOT" --namespace-id="${CF_KV_ID}" --remote
            fi
          fi
