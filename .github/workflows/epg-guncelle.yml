name: EPG guncelle

on:
  workflow_dispatch:
  schedule:
    # Gunde 2 kez: 05:00 ve 17:00 (Istanbul saati)
    - cron: "0 2,14 * * *"

concurrency:
  group: epg-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_KV_ID: ${{ secrets.CF_KV_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: iptv-org/epg aracini indir
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg-tool
          cd epg-tool && npm ci --no-audit --no-fund

      - name: Turksat eksik ara sertifikasini tamamla
        run: |
          set +e
          HOST=www.turksatkablo.com.tr
          echo | timeout 30 openssl s_client -connect $HOST:443 -servername $HOST 2>/dev/null | openssl x509 > leaf.pem
          URL=$(openssl x509 -in leaf.pem -noout -text 2>/dev/null | grep -oP 'CA Issuers - URI:\K\S+' | head -1)
          echo "Ara sertifika adresi: ${URL:-bulunamadi}"
          if [ -n "$URL" ] && curl -fsSL --max-time 30 "$URL" -o inter.raw; then
            openssl x509 -inform DER -in inter.raw -out inter.pem 2>/dev/null \
              || openssl x509 -in inter.raw -out inter.pem 2>/dev/null \
              || openssl pkcs7 -inform DER -in inter.raw -print_certs -out inter.pem 2>/dev/null
            if openssl x509 -in inter.pem -noout -subject 2>/dev/null; then
              echo "NODE_EXTRA_CA_CERTS=$PWD/inter.pem" >> "$GITHUB_ENV"
              echo "Ara sertifika eklendi."
            fi
          fi
          exit 0

      - name: Kanal listesini kaynaklara ayir
        run: |
          python3 - <<'EOF'
          import re
          satirlar = open('channels.xml', encoding='utf-8').read().splitlines()
          kanal = [s for s in satirlar if '<channel ' in s]
          def yaz(ad, secim):
              with open(ad, 'w', encoding='utf-8') as f:
                  f.write('<?xml version="1.0" encoding="UTF-8"?>\n<channels>\n' + '\n'.join(secim) + '\n</channels>\n')
          tv = [s for s in kanal if 'site="tvplus.com.tr"' in s]
          diger = [s for s in kanal if 'site="tvplus.com.tr"' not in s and 'site="turksatkablo.com.tr"' not in s]
          yaz('tvplus-channels.xml', tv); yaz('diger-channels.xml', diger)
          print('tvplus:', len(tv), 'diger:', len(diger))
          EOF

      - name: EPG verisini topla - tvplus (tek tek, aralikli)
        working-directory: epg-tool
        run: |
          mkdir -p ../guides
          npm run grab --- \
            --channels=../tvplus-channels.xml \
            --output="../guides/{site}.xml" \
            --days=3 \
            --maxConnections=1 \
            --delay=1500 \
            --timeout=60000 2>&1 | tee ../grab.log || true

      - name: EPG verisini topla - diger kaynaklar
        working-directory: epg-tool
        run: |
          npm run grab --- \
            --channels=../diger-channels.xml \
            --output="../guides/{site}.xml" \
            --days=3 \
            --maxConnections=3 \
            --timeout=60000 2>&1 | tee -a ../grab.log || true

      - name: Turksat verisini topla (ad ile eslestirme)
        run: python3 turksat.py || true

      - name: Kaynaklari birlestir ve rapor yaz
        run: python3 birlestir.py

      - name: KV'ye yukle
        run: npx --yes wrangler@4 kv key put "guide.xml" --path=guide.xml --namespace-id="${CF_KV_ID}" --remote

      - name: Worker'i yayinla
        run: |
          sed -i "s/KV_ID_BURAYA/${CF_KV_ID}/" wrangler.toml
          npx --yes wrangler@4 deploy
