name: Logolari indir

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Logolari indir (logolar.tsv)
        run: |
          mkdir -p logos
          tamam=0; hata=0
          while IFS="$(printf '\t')" read -r id url; do
            [ -z "$id" ] && continue
            if curl -fsSL --retry 2 --max-time 30 -A "Mozilla/5.0" "$url" -o "gecici.png" \
               && file gecici.png | grep -qi 'image'; then
              mv gecici.png "logos/$id.png"; tamam=$((tamam+1))
            else
              echo "Indirilemedi: $id ($url)"; hata=$((hata+1)); rm -f gecici.png
            fi
            sleep 0.3
          done < logolar.tsv
          echo "Indirilen: $tamam, hatali: $hata" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$tamam" -gt 0 ] || { echo "Hic logo indirilemedi"; exit 1; }

      - name: Depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos
          git diff --cached --quiet && { echo "Degisiklik yok"; exit 0; }
          git commit -m "Logolar guncellendi"
          git push
